[program:vncserver]
command=%(ENV_RESOURCES_PATH)s/scripts/start-vnc-server.sh
user=%(ENV_WORKSPACE_RUNTIME_USER)s
environment=HOME="%(ENV_WORKSPACE_RUNTIME_HOME)s",USER="%(ENV_WORKSPACE_RUNTIME_USER)s"
; Without this, the child process inherits supervisord's own CWD (/root), which this user can't
; access - harmless for most programs, but start-vnc-server.sh's `find ... -delete` call fails
; outright trying to restore that inaccessible working directory, aborting the whole script.
directory=%(ENV_WORKSPACE_RUNTIME_HOME)s
priority=55
autostart=true
autorestart=true
redirect_stderr=true 
stdout_logfile=/var/log/supervisor/%(program_name)s.log ; log logs into file
startretries=5   ; max # of serial start failures (default 3)