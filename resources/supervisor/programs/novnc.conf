[program:novnc]
; Listens on 127.0.0.1 only: nginx is the sole client (proxy_pass http://127.0.0.1:6901), and
; binding all interfaces would let anything on the pod network reach the desktop without passing
; nginx's auth - which matters when VNC_PW="" disables the VNC password.
command=python -m websockify --web  %(ENV_RESOURCES_PATH)s/novnc/ 127.0.0.1:6901 localhost:5901
; the launch script cannot be terminated -> %(ENV_RESOURCES_PATH)s/novnc/utils/launch.sh --vnc localhost:5901 --listen 6901
directory=%(ENV_RESOURCES_PATH)s/novnc/utils/websockify/
autostart=true
autorestart=true
redirect_stderr=true 
stdout_logfile=/var/log/supervisor/%(program_name)s.log ; log logs into file
startretries=5   ; max # of serial start failures (default 3)