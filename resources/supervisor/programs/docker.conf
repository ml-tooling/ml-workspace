[program:docker]
; --storage-driver=fuse-overlayfs avoids the classic nested-Docker-in-Docker failure: the default
; overlay2 driver can't mount on top of a host filesystem that's already overlay2 (most Docker
; hosts are) - "failed to mount ... overlay ... invalid argument" on every `docker run`, even
; though dockerd itself starts fine and `docker ps`/pull work. fuse-overlayfs is a userspace
; implementation that sidesteps the restriction.
;
; --bip and --default-address-pool move this NESTED dockerd's own bridge networks off Docker's
; standard default range (172.17.0.0/16 through 172.31.0.0/16) - confirmed in production that a
; host's own (outer) docker0, which almost always sits at the 172.17.0.1/16 default, collides
; with this container's nested docker0 landing on the exact same address. When that happens,
; return traffic from the host to this pod gets misrouted: the pod's own kernel sees the host's
; source IP (172.17.0.1) as a LOCAL address (its own nested docker0) and swallows the reply
; instead of sending it back out eth0 - everything works via localhost inside the container, but
; every external caller (kubelet probes, NodePort, any host-to-pod traffic) sees connection
; failures. 192.168.200.0/24 (bip) and 192.168.208.0/20 (the pool for any docker network create
; networks a developer makes) are both outside Docker's default range and don't overlap each
; other, so this can't recur regardless of what the host's own Docker is configured with.
; The CLI flag is singular (--default-address-pool, repeatable); the plural default-address-pools
; is only the daemon.json key - dockerd rejects the plural on the command line and never starts.
command=dockerd --host=unix:///var/run/docker.sock --storage-driver=fuse-overlayfs --bip=192.168.200.1/24 --default-address-pool base=192.168.208.0/20,size=24
; Deliberately no user= override (unlike jupyter/vscode) - dockerd needs to run as this
; container's own root, which is safe only because the host is expected to run this container
; under the sysbox-runc runtime, remapping that root to an unprivileged host UID.
priority=20
autostart=true
autorestart=true
stderr_logfile=/proc/1/fd/1 ; log error into stdout to see in docker logs
stderr_logfile_maxbytes=0
stdout_logfile=/var/log/supervisor/%(program_name)s.log ; log logs into file
startretries=5   ; max # of serial start failures (default 3)
